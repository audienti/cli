name: Publish Audienti Exo CLI (@audienti/cli)
on:
  push:
    branches: [main]
    paths: ['tofu/**', '.github/workflows/publish-tofu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'audienti/cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Smoke-test package tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          PKG_VER="$(node -p 'require("./package.json").version')"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/audienti-cli-${PKG_VER}.tgz"
          "$RUNNER_TEMP/smoke/node_modules/.bin/audienti" --help
          "$RUNNER_TEMP/smoke/node_modules/.bin/audienti" connect --help
          "$RUNNER_TEMP/smoke/node_modules/.bin/audienti" wake --help
          "$RUNNER_TEMP/smoke/node_modules/.bin/tofu" --help
      - name: Publish @audienti/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set +e
          PKG_VER="$(node -p 'require("./package.json").version')"
          npm view "@audienti/cli@${PKG_VER}" version --json > "$RUNNER_TEMP/cli-version.json" 2> "$RUNNER_TEMP/cli-version.err"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Version already published; no mutation.'
          elif grep -q E404 "$RUNNER_TEMP/cli-version.err"; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "NPM_PUBLISH_TOKEN is required to publish @audienti/cli." >&2
              exit 1
            fi
            npm publish --access public --tag latest
          else
            cat "$RUNNER_TEMP/cli-version.err" >&2
            exit "$status"
          fi
